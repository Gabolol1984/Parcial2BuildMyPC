spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      server:
        webmvc:
          # Cada ruta: si la URL entra por el patron 'predicates', el gateway la reenvia
          # a 'uri'. lb:// significa "busca este nombre en Eureka y balancea la carga".
          routes:
            - id: msvc-build
              uri: lb://msvc-build
              predicates:
                - Path=/api/v1/builds/**,/api/v2/builds/**
            - id: msvc-component
              uri: lb://msvc-component
              predicates:
                - Path=/api/v1/componentes/**,/api/v2/component/**
            - id: msvc-cpu
              uri: lb://msvc-cpu
              predicates:
                - Path=/api/v1/cpus/**,/api/v2/cpus/**
            - id: msvc-gpu
              uri: lb://msvc-gpu
              predicates:
                - Path=/api/v1/gpu/**,/api/v2/gpu/**
            - id: msvc-motherboard
              uri: lb://msvc-motherboard
              predicates:
                - Path=/api/v1/motherboard/**,/api/v2/motherboard/**
            - id: msvc-powerSupply
              uri: lb://msvc-powerSupply
              predicates:
                - Path=/api/v1/powerSupply/**,/api/v2/powerSupply/**
            - id: msvc-quotation
              uri: lb://msvc-quotation
              predicates:
                - Path=/api/v1/cotizaciones/**,/api/v2/cotizaciones/**
            - id: msvc-ram
              uri: lb://msvc-ram
              predicates:
                - Path=/api/v1/ram/**,/api/v2/ram/**
            - id: msvc-usuario
              uri: lb://msvc-usuario
              predicates:
                - Path=/api/v1/usuarios/**,/api/v2/usuarios/**
                -
          # las consume. Usan el prefijo /api-docs/<svc> (NO /v3/api-docs) para no chocar con
            # el /v3/api-docs propio del gateway. RewritePath lo traduce al /v3/api-docs real del servicio.
            - id: build-api-docs
              uri: lb://msvc-build
              predicates:
                - Path=/api-docs/build
              filters:
                - RewritePath=/api-docs/build, /v3/api-docs
            - id: pacientes-api-docs
              uri: lb://msvc-pacientes
              predicates:
                - Path=/api-docs/pacientes
              filters:
                - RewritePath=/api-docs/pacientes, /v3/api-docs
            - id: atenciones-api-docs
              uri: lb://msvc-atenciones
              predicates:
                - Path=/api-docs/atenciones
              filters:
                - RewritePath=/api-docs/atenciones, /v3/api-docs

# Punto de entrada unico: todo el trafico entra por aqui.
server:
  port: 8080

# El gateway tambien es cliente Eureka para poder resolver los lb://
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Swagger UI agregado: una sola pagina con un desplegable para elegir el microservicio.
springdoc:
  swagger-ui:
    enabled: true
    path: /docs/swagger-ui.html
    # El desplegable apunta a los docs de cada servicio (ruteados por el gateway via lb://).
    urls:
      - name: medicos
        url: /api-docs/medicos
      - name: pacientes
        url: /api-docs/pacientes
      - name: atenciones
        url: /api-docs/atenciones


# CLAVE SECRETA JWT: la MISMA que en msvc-usuarios y en los 3 microservicios. El gateway la usa para validar.
jwt:
  secret: clave-secreta-super-segura-para-jwt-hospital-msvc-duoc-2026-0616
spring.config.import=optional:file:.env[.properties]
spring.application.name=msvc-usuario
server.port=${PORT:8082}

# ── Base de datos PostgreSQL (Supabase en producción) ──
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea/actualiza las tablas automáticamente al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.datasource.hikari.connection-init-sql=SET search_path TO public

# ── Errores detallados ──
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# ── Swagger / OpenAPI ──
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# ── CORS ──
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# ── Eureka (deshabilitado en producción standalone) ──
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ── JWT ──
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=30

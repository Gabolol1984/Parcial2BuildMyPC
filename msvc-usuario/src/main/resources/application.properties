spring.config.import=optional:file:.env[.properties]

spring.application.name=msvc-usuario
server.port=${PORT:8082}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=30

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

spring.datasource.driver-class-name=org.postgresql.Driver
eureka.client.enabled=${EUREKA_ENABLED:true}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
app.cors.origenes=http://localhost:5173

spring.datasource.hikari.connection-init-sql=SET search_path TO public


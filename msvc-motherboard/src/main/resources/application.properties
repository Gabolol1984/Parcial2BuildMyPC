spring.application.name=msvc-motherboard
server.port=8087

spring.datasource.url=jdbc:h2:mem:db_motherboard
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=123

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# Registro en Eureka. spring.application.name (arriba) es el nombre con que queda registrado.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# CLAVE SECRETA JWT: EXACTAMENTE la misma que en msvc-usuarios y el gateway (para validar la firma).
jwt.secret=cambie-la-clave-porque-el-profe-nos-pidio-que-la-cambiaramos-2026